<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tech News Hub - Your one stop platform for the latest technology news from Hacker News, DEV.to, and The New York Times.">
    <title>Tech News Hub</title>
    <meta name="Author" content="Godfrey Hogan Eyo">

    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header__logo">
            <span class="header__icon">⚡</span>
            <h1 class="header__title">Tech News Hub</h1>
        </div>

        <div class="header__search">
            <input 
                type="search" 
                id="searchInput" 
                class="search__input" 
                placeholder="Search articles..."
                aria-label="Search articles"
            >
            <button class="search__btn" id="searchBtn" aria-label="Submit search">🔍</button>
        </div>

        <div class="header__controls">
            <button class="theme__toggle" id="themeToggle" aria-label="Toggle dark and light mode">🌙</button>
        </div>
    </header>

    <!-- MAIN -->
    <main class="main">

        <!-- SIDEBAR FILTERS -->
        <aside class="sidebar" aria-label="Filter articles">
            <h2 class="sidebar__title">Filters</h2>

            <!-- Source Filter -->
            <div class="filter__group">
                <h3 class="filter__heading">Source</h3>
                <label class="filter__label">
                    <input type="checkbox" class="filter__checkbox" value="hackernews" checked> 
                    Hacker News
                </label>
                <label class="filter__label">
                    <input type="checkbox" class="filter__checkbox" value="devto" checked> 
                    DEV.to
                </label>
                <label class="filter__label">
                    <input type="checkbox" class="filter__checkbox" value="nytimes" checked> 
                    NY Times
                </label>
            </div>

            <!-- Sort Filter -->
            <div class="filter__group">
                <h3 class="filter__heading">Sort By</h3>
                <select class="filter__select" id="sortSelect" aria-label="Sort articles by">
                    <option value="newest">Newest</option>
                    <option value="popular">Most Popular</option>
                    <option value="comments">Most Comments</option>
                </select>
            </div>

            <!-- Bookmarks -->
            <div class="filter__group">
                <button class="btn__bookmarks" id="bookmarksBtn">🔖 Saved Articles</button>
            </div>

        </aside>

        <!-- NEWS FEED -->
        <section class="news__feed" aria-label="News articles">

            <!-- Last Updated -->
            <div class="feed__meta">
                <span id="lastUpdated" class="feed__updated"></span>
                <button class="btn__refresh" id="refreshBtn" aria-label="Refresh articles">↻ Refresh</button>
            </div>

            <!-- Article Cards Container -->
            <div class="articles__grid" id="articlesGrid">
                <!-- Cards injected here by ui.js -->
            </div>

        </section>

    </main>

    <!-- ARTICLE MODAL -->
    <div class="modal__overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
        <div class="modal__content">
            <button class="modal__close" id="modalClose" aria-label="Close modal">✕</button>
            <span class="modal__source" id="modalSource"></span>
            <h2 class="modal__title" id="modalTitle"></h2>
            <p class="modal__description" id="modalDescription"></p>
            <div class="modal__meta">
                <span id="modalDate"></span>
                <span id="modalComments"></span>
            </div>
            <a class="modal__link" id="modalLink" target="_blank" rel="noopener noreferrer">Read Full Article →</a>
        </div>
    </div>

    <!-- JS Entry Point -->
    <script type="module" src="js/app.js"></script>

</body>
</html>
